<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cfc"/>
      <stop offset="50%" style="stop-color:#fc5c7d"/>
      <stop offset="100%" style="stop-color:#ff6a00"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fc5c7d;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c5cfc;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
 
  <!-- Dark background with rounded corners -->
  <rect width="32" height="32" rx="8" fill="#0a0a0f"/>

  <!-- Subtle inner glow -->
  <rect width="32" height="32" rx="8" fill="url(#g2)"/>

  <!-- Diamond / rhombus shape -->
  <polygon points="16,3 29,16 16,29 3,16" fill="none" stroke="url(#g1)" stroke-width="1.5" filter="url(#glow)" opacity="0.9"/>

  <!-- Inner smaller diamond -->
  <polygon points="16,8 24,16 16,24 8,16" fill="url(#g1)" opacity="0.15"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="3" fill="url(#g1)" filter="url(#glow)"/>

  <!-- Top accent line -->
  <line x1="16" y1="3" x2="16" y2="10" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Corner sparkle dots -->
  <circle cx="16" cy="3" r="1.2" fill="#7c5cfc" filter="url(#glow)"/>
  <circle cx="29" cy="16" r="1.2" fill="#fc5c7d" filter="url(#glow)"/>
  <circle cx="16" cy="29" r="1.2" fill="#ff6a00" filter="url(#glow)"/>
  <circle cx="3" cy="16" r="1.2" fill="#7c5cfc" filter="url(#glow)"/>
</svg>
